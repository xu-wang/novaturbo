pack_version: geometry19_calibration_bootstrap_v1
calibration_schema_version: geometry19_calibration_schema_v1
physics_spec_version: geometry19_closed_v2_1
design_schema_version: geometry19_schema_v1
status: bootstrap_candidate
formal_dataset_generation_ready: false
notes: >-
  Non-null implementation candidate values for coding and validation only.
  PROJECT_BOOTSTRAP_ASSUMPTION records are hypotheses, not validated truth.
  Literature-screening revision 2026-08-24 records definition and provenance
  findings, but its trial numerical limits were rolled back. Exact
  bibliographic records and component-specific validation remain required
  before any numerical constraint changes are frozen.
reference_states:
  turbine_corrected_mass_flux:
    temperature_K: 288.15
    pressure_Pa: 101325.0
    unit: kg/(s*m^2)
parameter_groups:
