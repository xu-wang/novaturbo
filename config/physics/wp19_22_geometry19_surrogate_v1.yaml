regression_dataset: data/generated/wp19_21_development_dataset_98304_v1/regression_converged.jsonl
feasibility_dataset: data/generated/wp19_21_development_dataset_98304_v1/feasibility_all.jsonl
campaign_split:
  train: [seed_20260826, seed_20260827, seed_20260828, seed_20260829]
  validation: [seed_20260830]
  test: [seed_20260831]
architecture:
  architecture_tag: legacy_surrogate_mlp_geometry19_v1
  hidden_layers: [128, 256, 256, 128, 64]
  activation: relu
  dropout: 0.1
  batch_norm: true
forward:
  model_tag: novaturbo_geometry19_forward_mlp_48d_v1
  performance_loss_weight: 0.5
  constraint_loss_weight: 0.5
feasibility:
  model_tag: novaturbo_geometry19_feasibility_mlp_5class_v1
