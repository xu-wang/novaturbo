    - CONVERGED_SELECTED_MULTIPLE
    - NO_FLOW_MATCH
    - GEOMETRY_INVALID
    - FLOW_RESIDUAL_DISCONTINUITY
training:
  seed: 42
  device: cpu
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.00001
  epochs: 80
  patience: 12
  min_delta: 0.000001
  num_workers: 0
smoke:
  epochs: 2
  patience: 2
  maximum_rows_per_split: 512
validation:
  mesh_quality: preview_mesh
  selection_kinds: [best_prediction, worst_prediction, boundary, random]
artifacts:
  weights_root: data/trained_models/geometry19
  mesh_storage_root: exports/geometry19
  runtime_root: data/inverse_design/wp19_22_geometry19_surrogate_v1
  summary_json: results/physics/wp19_22_geometry19_surrogate_v1.json
  report_markdown: docs/physics/WP19_22_GEOMETRY19_SURROGATE_20260826.md
