profile_version: geometry19_constraint_profile_engineering_candidate_v1
description: >-
  Geometry19 engineering-candidate profile. Numerical validity, physics-domain
  validity, and every currently evaluated engineering constraint are required
  for acceptance.

acceptance:
  require_numerical_valid: true
  require_physics_domain_valid: true
  require_engineering_feasible: true

constraint_partition:
  numerical_hard:
    - solver convergence and typed failure state
    - finite positive thrust, TSFC, and V2.1 mass
    - finite conservation residuals
  physics_domain:
    - complete matched component state
    - finite thermodynamic-domain residuals
  engineering_soft:
    - thermodynamic performance and calibration limits
    - assembly limits
    - structural limits
    - thermal limits
    - manufacturing limits

