- compressor_pressure_ratio
- compressor_total_to_total_efficiency
- turbine_total_to_total_efficiency
- mass_flow_fuel_kg_s
- air_fuel_ratio
- turbine_exit_total_pressure_Pa
- turbine_exit_total_temperature_K
cross_constraints:
- id: compressor_inducer_order
  stage: pre_solver_hard
  expression: lambda_c1*D_c1t < D_c1t < D_c2
  description: The inducer hub is inside the inducer tip and the inducer tip is inside
    the impeller exit.
- id: compressor_exit_blockage
  stage: pre_solver_hard
  expression: 0 < B_c2 < 1
  requires_calibration:
  - compressor_blade_thickness_ratio
- id: combustor_annulus
  stage: pre_solver_hard
  expression: D_bo > D_bi + 2*t_b
- id: turbine_annulus
  stage: pre_solver_hard
  expression: 0 < lambda_t < 1 and D_t > 0
- id: compressor_tip_speed
  stage: post_geometry_feasibility
  expression: pi*D_c2*N/60 <= U_c2_max
  requires_calibration:
  - compressor_tip_speed_limit_m_s
- id: turbine_tip_speed
  stage: post_geometry_feasibility
  expression: pi*D_t*N/60 <= U_t_tip_max
  requires_calibration:
  - turbine_tip_speed_limit_m_s
- id: diffuser_to_combustor_area
  stage: post_geometry_feasibility
  expression: abs((A_d_out/A_b_in)-Pi_A_db) <= epsilon_A_db
  derived_diffuser: A_d_out=Pi_A_d*A_c2; L_d=k_Ld*D_c2
  requires_calibration:
  - k_Ld
  - Pi_A_db
  - epsilon_A_db
  requires_design_variable:
  - diffuser_area_ratio
- id: combustor_to_turbine_outer_diameter
  stage: post_geometry_feasibility
  expression: abs(D_bo-D_t)/D_t <= epsilon_D_bt
  requires_calibration:
  - epsilon_D_bt
- id: shaft_clearance
  stage: post_geometry_feasibility
  expression: D_s + 2*delta_s <= D_bi
  requires_calibration:
  - shaft_radius_ratio
  - shaft_clearance_m
- id: turbine_to_nozzle
  stage: post_geometry_feasibility
  expression: abs(D_n_in-D_t)/D_t <= epsilon_D_tn
  requires_calibration:
  - nozzle_inlet_ratio
  - epsilon_D_tn
sampling_policy:
  continuous: lhs_or_sobol
  integer: balanced_discrete
  apply_pre_solver_hard_constraints_before_physics: true
  retain_hard_failure_records: true
  retain_soft_infeasible_records: true
quality_fields:
- converged
- feasible
- failure_code
- failure_class
- flow_residual
- physics_model_version
- calibration_pack_hash
