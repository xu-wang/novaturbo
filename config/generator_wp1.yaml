dataset_version: generator_v1_baseline10k_v1
schema: config/generator_v1_schema.yaml
source:
  csv: baseline_results/baseline_v1/data/dataset_10000.csv
  source_id: baseline_v1/data/dataset_10000.csv
output:
  directory: data/generator_v1
  split_csv: data/splits/generator_v1_split.csv
  refuse_overwrite: true
split:
  seed: 42
  train_fraction: 0.80
  val_fraction: 0.10
  test_fraction: 0.10
parity:
  thrust_absolute_tolerance: 1.0e-10
  thrust_relative_tolerance: 1.0e-10
  tsfc_absolute_tolerance: 1.0e-12
  tsfc_relative_tolerance: 1.0e-10
