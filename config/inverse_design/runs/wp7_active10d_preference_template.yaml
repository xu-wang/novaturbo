version: wp7_active10d_preference_run_v1
run_id: wp7_active10d_template
mode: hybrid

model:
  model_id: cvae
  checkpoint_path: data/generator_models/wp3_active10d_full_gpu6_v1/cvae/seed_42/best.pt

data:
  dataset_csv: data/generator_active10d_100k/generator_active10d_valid.csv
  dataset_version: generator_active10d_expanded100k_v1
  schema: config/generator_active10d_schema.yaml
  normalizer: data/generator_active10d_100k/normalizer_active10d.json
  normalizer_version: generator_active10d_v1_train_79945
  normalizer_sha256: 9bf25fe526a395beadf4057012e67a5823d88757c11457346ec36c21a2a1b68b
  metrics_config: config/generator_active10d_metrics.yaml

seeds:
  generator: 20250813
  optimizer: 42
  background: 42

generation:
  n_generated: 256

selection:
  strategy: physics_error_diverse
  selected_count: 256

population:
  generator_ratio: 0.7
  background_method: random
  duplicate_tolerance: 1.0e-9
  preference:
    enabled: true
    pool_size: 256
    reference_dataset: data/generator_v1_100k/dataset_100000_raw.csv
    background_seed_offset: 1000003
    directions:
      - [0.4, 0.2, 0.2, 0.2]
      - [0.2, 0.4, 0.2, 0.2]
      - [0.2, 0.2, 0.4, 0.2]
      - [0.2, 0.2, 0.2, 0.4]
      - [0.25, 0.25, 0.25, 0.25]

optimizer:
  seed: 42
  population_size: 40
  n_generations: 15
  crossover_rate: 0.9
  mutation_rate: 0.1
  mutation_scale: 0.1
  tournament_size: 3
  objectives:
    - thrust_N
    - tsfc_kg_N_s
    - total_mass_kg
    - thrust_to_weight
  maximize: [true, false, false, true]
  min_thrust_N: 30.0
  max_tsfc: 0.00005
  max_mass_kg: 3.0
  use_surrogate: false
  surrogate_model_path: null
  warm_start_out_of_bounds_policy: reject

runtime:
  device: cuda

output:
  root: data/inverse_design/wp7_active10d_preference/runs
  refuse_overwrite: true
