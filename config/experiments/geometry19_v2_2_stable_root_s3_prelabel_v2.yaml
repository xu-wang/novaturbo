primary_directions:
  reuse_v1_direction_definition: true
  axis_directions: 19
  sobol_directions: 29
  sobol_seed: 20260915
  sobol_generation: random_base2_m5_take_first_29
  shell_0_50_primary_directions: 24
  shell_0_90_primary_directions: 24

reserve_directions:
  family: deterministic_sobol_reserve
  count: 64
  sobol_seed: 20260916
  sobol_generation: random_base2_m6_take_all_64
  transform: two_u_minus_one_then_unit_l2_normalize
  shell_assignment: even_index_to_0_50_odd_index_to_0_90
  use_order: ascending_reserve_index_within_shell
  use_only_to_replace_coordinate_ineligible_primary_pairs: true

boundary_aware_scaling:
  proposal_space: schema_range_normalized
  desired_step: support_radius_p95_times_shell_fraction
  common_two_sided_limit: minimum_over_nonzero_axes_of_min_center_to_lower_and_upper_boundary_divided_by_abs_direction
  safety_factor_eta: 0.95
  actual_step: minimum_of_desired_step_and_eta_times_common_two_sided_limit
  minimum_actual_to_desired_ratio: 0.25
  reject_pair_if_ratio_below_minimum: true
  clipping_allowed: false
  preserve_positive_negative_pair: true

integer_axis_policy:
  variable_names: [compressor_blade_count, combustor_injector_count, turbine_blade_count]
  anchor: numpy_rint_of_physical_root_center
  pair: anchor_plus_one_and_anchor_minus_one
  require_both_values_within_integer_schema_bounds: true
  minimum_ratio_gate_applies: false
  reject_and_use_reserve_if_pair_not_legal_or_unique: true
  non_integer_directions_round_integer_coordinates_with_numpy_rint: true

selection:
  target_selected_pairs_per_root: 48
  target_selected_pairs_per_shell: 24
  final_prelabel_rows_per_root: 96
  final_prelabel_rows_total: 3648
  consider_primary_then_reserve_within_each_shell: true
  pair_acceptance_requires:
    - both_designs_inside_schema
    - both_design_hashes_distinct_within_pair
    - neither_design_hash_in_development
    - neither_design_hash_previously_selected_in_v2
    - non_integer_pair_step_ratio_at_least_0_25
  rejected_screening_pairs_recorded: true
  no_performance_adaptation: true

ledger:
  screening_ledger_contains_all_considered_pairs: true
  final_ledger_contains_selected_pairs_only: true
  label_status: NOT_EVALUATED_PRELABEL_ONLY
  performance_fields_allowed: false
  physics_fields_allowed: false
  model_prediction_fields_allowed: false

v2_gate:
  exact_roots: 38
  exact_selected_pairs_per_root: 48
  exact_selected_pairs_per_shell_per_root: 24
  exact_final_rows: 3648
  require_all_final_design_hashes_unique: true
  require_no_final_overlap_with_development: true
  require_all_final_coordinates_inside_schema: true
  require_zero_performance_physics_or_prediction_fields: true
  require_model_files_unopened: true
  require_confirmation_content_unread: true

