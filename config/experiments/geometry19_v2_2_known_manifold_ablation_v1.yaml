protocol_version: geometry19_v2_2_known_manifold_ablation_v1
status: development_only_known_manifold_model_selection
formal_use_allowed: false

design_schema: config/physics/geometry19_schema_v1.yaml
target_domain: config/physics/geometry19_v2_2_development_target_domain_v1.yaml
development_dataset:
  path: data/validation/v2_2_known_manifold_root_discovery_v1/development_dataset.jsonl
  sha256: cde2c3f6a0cebc91a437f45b7aae5d2ebfe2b8adff952942d05efaae09297134
development_folds:
  path: data/validation/v2_2_known_manifold_root_discovery_v1/development_root_folds.json
  sha256: facc23ac72e85dda7da5723e480b58e4b9dcf95dbe8d531482371938bc48599a
sealed_confirmation:
  path: data/validation/v2_2_fresh_low_mass_confirmation_split_v1/splits/confirmation.jsonl
  sha256: a3051cae177d1c9735699ef4b50675f41f5f0ffd7d954b3a233f5ebf1ea8b1fd

target_segments: [low_mass_low_to_mid, low_mass_mid_to_high]

variants:
  - id: legacy_no_change
    family: mlp
    root_balanced: false
    hidden_layers: [128, 256, 256, 128, 64]
    normalization_layer: batch_norm
    dropout: 0.1
    hit_aligned_rho_weight: 0.0
  - id: small_mlp_plain
    family: mlp
    root_balanced: true
    hidden_layers: [64, 64, 32]
    normalization_layer: none
    dropout: 0.0
    hit_aligned_rho_weight: 0.05
  - id: small_mlp_layernorm
    family: mlp
    root_balanced: true
    hidden_layers: [64, 64, 32]
    normalization_layer: layer_norm
    dropout: 0.0
    hit_aligned_rho_weight: 0.05
  - id: ridge
    family: ridge
    root_balanced: true
    alpha: 1.0
  - id: extra_trees
    family: extra_trees
    root_balanced: true
    n_estimators: 256
    min_samples_leaf: 3
    max_features: 1.0

training:
  device: cuda:0
  seed: 42
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.00001
  epochs: 150
  patience: 20
  min_delta: 0.000001
  smooth_max_temperature: 8.0

support_gate:
  calibration_quantile: 0.99
  explained_variance_fraction: 0.995
  minimum_target_validation_root_acceptance_fraction: 0.80

selection:
  primary: development_multi_fold_maximum_worst_root_rho_p95
  secondary: development_multi_fold_maximum_root_rho_p95_p95
  support_rejection_used_for_model_selection: false
  development_accuracy_gate: NOT_PRE_REGISTERED_MODEL_SELECTION_ONLY

artifacts:
  runtime_root: data/validation/v2_2_known_manifold_ablation_v1
  summary: summary.json
  report: Known_Manifold_Ablation_Report.md

limitations:
  - development_five_fold_selection_only
  - existing_confirmation_content_is_not_read
  - support_gate_is_design_side_observed_support_not_a_manifold_proof
  - no_unknown_region_accuracy_claim
  - no_formal_or_deployment_claim
