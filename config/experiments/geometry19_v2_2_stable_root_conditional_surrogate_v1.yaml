  mixed_roots: excluded_diagnostic_only
  stable_acceptance_minimum: 0.80
  always_unreliable_false_acceptance_maximum: 0.20
  minimum_rows_per_stable_root: 24
  minimum_effective_rank_per_stable_root: 6
  sphere_overlap_rule: center_distance_le_sum_of_radii

