version: diag_cfm_hybrid_fiveway_eval_seed42_v1
metrics_config: config/generator_active10d_metrics.yaml

data:
  dataset_csv: data/generator_active10d_100k/generator_active10d_valid.csv
  schema: config/generator_active10d_schema.yaml
  normalizer: data/generator_active10d_100k/normalizer_active10d.json
  target_suite: config/experiments/cfm_arch/cfm_0_generalization_targets.csv

models:
  diag_cfm_fair:
    checkpoint: data/generator_models/diag_cfm/diag_cfm_v1_gpu6/diag_cfm/seed_42/best.pt
    generator_name: diag_cfm
    generator_overrides: {ode_method: rk4, ode_steps: 32}
  diag_cfm_paper_literal:
    checkpoint: data/generator_models/diag_cfm/diag_cfm_paper_gasturbine_v1_gpu6/diag_cfm/seed_42/best.pt
    generator_name: diag_cfm
    generator_overrides: {ode_method: euler, ode_steps: 30}
  diag_cfm_paper_nova:
    checkpoint: data/generator_models/diag_cfm/diag_cfm_paper_arch_nova_v1_gpu6/diag_cfm/seed_42/best.pt
    generator_name: diag_cfm
    generator_overrides: {ode_method: rk4, ode_steps: 32}
  cfm_diag_reranked:
    checkpoint: data/generator_models/stage2/cfm_arch/s2_wp4b_cfm_4_gpu_sinkhorn_gpu6_v1/cfm/seed_42/best.pt
    generator_name: cfm
    generator_overrides: {ode_method: rk4, ode_steps: 32}
    sampling:
      policy: diag_rerank_fixed_raw
      draw_count: 512
      reranker_checkpoint: data/generator_models/diag_cfm/diag_cfm_paper_arch_nova_v1_gpu6/diag_cfm/seed_42/best.pt
      reranker_ode_method: rk4
      reranker_ode_steps: 32
  cfm:
    checkpoint: data/generator_models/stage2/cfm_arch/s2_wp4b_cfm_4_gpu_sinkhorn_gpu6_v1/cfm/seed_42/best.pt
    generator_overrides: {ode_method: rk4, ode_steps: 32}

runtime:
  device: cuda
  sample_count: 128
  sample_seed: 20260817
  sample_seed_namespace: diag_cfm_vs_cfm4_formal_v1
  maximum_targets_per_type: null
  sampling: {policy: v2_1_fixed_raw}

output:
  directory: data/inverse_design/diag_cfm/diag_cfm_hybrid_eval_seed42_v1
  refuse_overwrite: true
