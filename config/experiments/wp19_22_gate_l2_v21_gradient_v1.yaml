  maximum_validation_rho_regression: 0.10
  minimum_validation_gradient_loss_reduction: 0.05
promotion:
  minimum_gate_i_descent_precision: 0.60
  minimum_gate_i_tsfc_sign_accuracy: 0.75
  require_frozen_top32_no_regression: true
closure:
  gate_i_config: config/experiments/wp19_23_gate_i_hit_alignment_ablation_v1.yaml
  c_true_physics_budget_per_target: 32
  maximum_d_true_physics_per_target: 24
artifacts:
  runtime_root: data/inverse_design/wp19_22_gate_l2_v21_gradient_v1
  central_gradient_dataset: v21_central_gradient_dataset.jsonl
  training_summary: gate_l2_training_summary.json
  frozen_summary: gate_l2_frozen_summary.json
  report: Gate_L2_report.md
  closure_root: full_closure
  closure_summary: gate_l2_closure_summary.json
  closure_report: Gate_L2_closure_report.md
