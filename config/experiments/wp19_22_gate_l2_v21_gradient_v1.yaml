protocol_version: wp19_22_gate_l2_v21_gradient_v1
work_package: WP19-22-Gate-L2
status: development_v21_central_gradient
formal_use_allowed: false
base_surrogate_protocol: config/physics/wp19_22_geometry19_surrogate_v1.yaml
inverse_protocol: config/physics/wp19_23_inverse_closure_v1.yaml
gate_k_config: config/experiments/wp19_22_gate_k_hit_aligned_surrogate_v1.yaml
gate_k2_config: config/experiments/wp19_22_gate_k2_full_closure_v1.yaml
gate_k2_summary: data/inverse_design/wp19_22_gate_k2_full_closure_v1/gate_k2_summary.json
