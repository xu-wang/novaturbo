  minimum_valid_pairs: {train: 192, validation: 48, test: 48}
training:
  seed: 43
  batch_size: 1024
  gradient_batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs: 30
  patience: 6
  min_delta: 0.000001
  gradient_huber_delta: 1.0
  gradient_cosine_weight: 0.25
