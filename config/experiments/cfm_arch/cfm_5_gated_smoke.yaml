version: s2_arch_cfm_5_gated_smoke_v1
lockfile: config/third_party_models.lock.yaml

training_contract:
  require_full_train_split: false
  require_full_val_split: false
  minimum_epochs_completed: 1
  require_early_stopping: false
  accepted_termination_reasons: [max_epochs]

data:
  dataset_csv: data/generator_active10d_100k/generator_active10d_valid.csv
  schema: config/generator_active10d_schema.yaml
  normalizer: data/generator_active10d_100k/normalizer_active10d.json
  target_suite: config/experiments/cfm_arch/cfm_0_generalization_targets.csv
  batch_size: 256
  num_workers: 0
  subset_seed: 314159
  max_train_samples: 512
  max_val_samples: 256

runtime:
  seeds: [42]
  device: cuda
  epochs: 1
  minimum_epochs: 1
  patience: 1
  min_delta: 1.0e-5
  gradient_clip_norm: 10.0
  checkpoint_sample_count: 128
  lr_scheduler: {enabled: false}

models:
  cvae: {enabled: false}
  nflows: {enabled: false}
  cinn: {enabled: false}
  cfm:
    enabled: true
    architecture: gated
    architecture_id: CFM-5
    design_dim: 10
    condition_dim: 3
    hidden_dim: 256
    residual_blocks: 2
    gated_blocks: 2
    gate:
      type: glu_style
      value_activation: silu
      gate_activation: sigmoid
      residual: true
    time_embedding:
      enabled: true
      type: sinusoidal
      dim: 32
      max_period: 10000.0
      time_scale: 1000.0
      trainable_projection: false
    sigma: 0.0
    ode_method: rk4
    ode_steps: 32
    ode_rtol: 0.00001
    ode_atol: 0.00001
    learning_rate: 0.001
    weight_decay: 0.00001
    bounded_output: {enabled: false}

output:
  directory: data/generator_models/stage2/cfm_arch/cfm_5_smoke_gpu6_v1
  refuse_overwrite: true
